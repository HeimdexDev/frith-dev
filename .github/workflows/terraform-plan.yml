name: terraform-plan

# Plan on every PR that touches infra; the plan is posted as a PR comment.
# Apply stays manual (see README) for the POC.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN        output github_ci_role_arn
#   AWS_REGION          e.g. ap-northeast-2
#   TF_STATE_BUCKET     bootstrap output state_bucket_name
#   TF_VAR_OWNER, TF_VAR_COGNITO_DOMAIN_PREFIX, TF_VAR_ALERT_EMAILS (JSON list),
#   TF_VAR_BUDGET_EMAILS (JSON list), TF_VAR_MONTHLY_BUDGET_USD, TF_VAR_GITHUB_REPO

on:
  pull_request:
    paths:
      - "infra/environments/**"
      - "infra/modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    # Skipped (not failed) until the CI OIDC role exists and the repo variable is set.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/environments/poc
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
      TF_VAR_cognito_domain_prefix: ${{ vars.TF_VAR_COGNITO_DOMAIN_PREFIX }}
      TF_VAR_alert_emails: ${{ vars.TF_VAR_ALERT_EMAILS }}
      TF_VAR_budget_emails: ${{ vars.TF_VAR_BUDGET_EMAILS }}
      TF_VAR_monthly_budget_usd: ${{ vars.TF_VAR_MONTHLY_BUDGET_USD }}
      TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive ../..

      - name: init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=frith/poc/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        # -lock=false: plan never writes state; avoids lock contention with an apply.
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### terraform plan (infra/environments/poc) — exit ${EXITCODE}"
            echo '<details><summary>show plan</summary>'
            echo
            echo '```'
            # PR comments are capped (~65k chars); keep the tail (summary line).
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: fail on plan error
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
