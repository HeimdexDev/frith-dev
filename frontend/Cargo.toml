[package]
name = "frith-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
leptos = { version = "0.8", features = ["ssr"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
